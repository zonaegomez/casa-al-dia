  const direct=computeBalances().directTransfers.find(t=>t.fromId===l.lenderId&&t.toId===l.borrowerId),left=l.amountCents-l.payments.filter(p=>p.status==='confirmed').reduce((n,p)=>n+p.amountCents,0),cap=Math.min(left,CasaCore.cents(direct?.amount||0));
  if(cap<=0)throw Error('No hay una deuda compartida en sentido contrario que compensar');
  openModal(`<div class="modal-header"><h3>Compensar deudas entre ustedes</h3><button class="btn" onclick="App.closeModal()">Cerrar</button></div><div class="modal-body"><p>${esc(l.lenderName)} debe ${fmtMoney(direct.amount)} a ${esc(l.borrowerName)} en gastos de la casa. Este préstamo tiene ${loanMoney(left)} pendientes en sentido contrario.</p><p>El importe acordado reducirá ambas deudas una sola vez cuando la otra persona acepte. No se envía dinero. La fecha será el día de la aceptación.</p><div class="field"><label for="offsetAmount">Importe a compensar (máximo ${loanMoney(cap)})</label><input id="offsetAmount" type="number" min="0.01" max="${cap/100}" step="0.01" value="${(cap/100).toFixed(2)}"></div><p>La casa verá un ajuste acordado con sus nombres e importe. El concepto, total y saldo restante del préstamo no se publican. El ajuste aceptado no admite anulación unilateral.</p></div><div class="modal-foot"><button class="btn btn-primary" onclick="App.savePrivateOffset('${id}',${l.version})">Proponer a la otra persona</button></div>`);
 },
 async savePrivateOffset(id,expectedVersion){await postPrivateLoan({action:'propose-offset',loanId:id,operationId:state.formOperationId,expectedVersion,amount:document.getElementById('offsetAmount').value});closeModal();toast('Propuesta enviada; los saldos cambiarán cuando la otra persona acepte');},
 async savePrivatePayment(id,expectedVersion){await postPrivateLoan({action:'payment',loanId:id,operationId:state.formOperationId,expectedVersion,amount:document.getElementById('loanPayment').value});closeModal();toast('Abono reportado. El saldo bajará cuando se confirme la recepción');},
 async privateLoanAction(id,action,paymentId){
  const l=privateLoans.find(l=>l.id===id);if(!l)throw Error('Préstamo no disponible');
  if(!confirm(action==='confirm-offset'?'¿Aceptas compensar este importe? Reducirá ambas deudas y la casa verá el ajuste con sus nombres e importe, sin los detalles del préstamo. No se mueve dinero ni se permite anularlo unilateralmente.':'¿Confirmas esta acción? Quedará en el historial de las dos personas.'))return;
  await postPrivateLoan({action,loanId:id,expectedVersion:l.version,operationId:uid(),paymentId});toast('Confirmación guardada');
 },
 explainBalance(memberId){
  const row=computeBalances().balances.find(r=>r.member.id===memberId);if(!row)return;
  const adjustment=(Math.round(row.balance*100)-Math.round(row.paid*100)+Math.round(row.fairShare*100))/100;
  const lines=allExpenseRows().filter(r=>!r.debtFronted).map(r=>{const part=CasaCore.balances([r],state.members,[]).balances.find(b=>b.member.id===memberId);return {r,part};}).filter(x=>x.part&&(x.part.paid||x.part.fairShare));
  openModal(`<div class="modal-header"><h3>Cuenta de ${esc(row.member.name)}</h3><button class="btn" onclick="App.closeModal()">Cerrar</button></div><div class="modal-body"><p>Dinero que esta persona pagó en compras y servicios: <strong>${fmtMoney(row.paid)}</strong></p><p>Parte que le corresponde de esos gastos: <strong>${fmtMoney(row.fairShare)}</strong></p><p>Ajuste por transferencias entre integrantes: <strong>${adjustment>=0?'+':''}${fmtMoney(adjustment)}</strong></p><p>Pagó − le correspondía + ajuste = <strong>${row.balance<0?'Por pagar: ':row.balance>0?'Por cobrar: ':'Sin pendiente '}${fmtMoney(Math.abs(row.balance))}</strong></p><p>Una transferencia enviada reduce lo que esta persona debe; una recibida reduce lo que tiene por cobrar. Los préstamos privados van por separado; una compensación aceptada por ambos se refleja como ajuste acordado.</p><details><summary>Ver cada compra y servicio</summary>${lines.map(({r,part})=>'<p>'+esc(r.name)+' · '+fmtDate(r.date)+'<br>Pagó '+fmtMoney(part.paid)+' · le corresponde '+fmtMoney(part.fairShare)+'</p>').join('')}</details></div>`);
 }
});

// Each device serializes commands and keeps the form operation ID on retry.
let commandPending=false;
for(const [name,fn] of Object.entries(App)){
 if(['prepareTicketPhoto','prepareProfilePhoto','invitationUiAction'].includes(name)||(fn.constructor.name!=='AsyncFunction'&&!name.startsWith('confirmDelete')))continue;
 App[name]=async function(...args){
  if(commandPending)return;commandPending=true;
  try{return await fn.apply(App,args);}catch(e){console.error(name,e);toast(e.message||'No se pudo guardar. Revisa la conexión y vuelve a intentar.');}finally{commandPending=false;render();}
 };
}

boot();
})();
</script>

  await Purchases.edit(id,{itemName:name,total,date,category,participantIds,memberId:mem?.id||current.memberId||null,memberName:mem?.name||current.memberName||'Varios integrantes'},operationMeta('correct-expense'));closeModal();toast('Compra y obligaciones conciliadas');
 },
 async confirmDeleteMovement(id){
 if(!confirm('¿Anular la compra completa, revertir sus existencias y cancelar sus deudas sin abonos?'))return;
 await Purchases.voidPurchase(id,{kind:'void-purchase'});closeModal();toast('Compra anulada y conciliada');
 },
 async duplicateMovement(id){
 const m=state.movements.find(x=>x.id===id);if(!m)return;
 if(m.itemId){modalMovement('compra',m.itemId);document.getElementById('mvQty').value=m.qty;document.getElementById('mvCost').value=m.total;return;}
 // A repeat is always a new reviewed form, never an invisible copy of old allocations.
 modalManualExpense();document.getElementById('meName').value=m.itemName;document.getElementById('meAmount').value=m.total;document.getElementById('meCat').value=m.category;
 toast('Confirma pagadores y beneficiarios de la nueva compra. Para reponer existencias usa Registrar compra o Ticket.');
 },
 async saveBillPayment(id){
  const paidAt=document.getElementById('payDate').value||todayISO(),splitOn=document.getElementById('paySplitToggle')?.checked;
  const mem=activeMembers().find(m=>m.id===document.getElementById('payPayer')?.value);if(!splitOn&&!mem)throw Error('Selecciona quién hizo la aportación');
  const splits=splitOn?[...document.querySelectorAll('.pay-split-input')].map(i=>({memberId:i.dataset.member,memberName:i.dataset.name,amount:CasaCore.money(i.value)})).filter(s=>s.amount>0):null;
  const amount=splitOn?CasaCore.money(splits.reduce((s,p)=>s+p.amount,0)):CasaCore.money(document.getElementById('payAmount').value);CasaCore.number(amount,'Pago',true);
  const dueDate=document.getElementById('payDueDate')?.value||state.bills.find(b=>b.id===id)?.nextDueDate;
  await BillService.pay(id,{receiptTotal:CasaCore.money(document.getElementById('payReceiptTotal').value),amount,paidAt,dueDate,memberId:splitOn?null:mem.id,memberName:splitOn?'Varios integrantes':mem.name,participantIds:participants(),...(splits?{splits}:{})},operationMeta('bill-payment'));
  closeModal();toast('Aportación guardada. El vencimiento avanza al cubrir el recibo completo');
 },
 async saveEditBillPayment(billId,idx){
  const h=state.bills.find(b=>b.id===billId)?.history[idx];if(!h?._paymentId)throw Error('Este pago es anterior a la actualización. Migra los pagos con el procedimiento documentado antes de editarlo.');
  const splitOn=document.getElementById('bpSplitToggle')?.checked;
  const splits=splitOn?[...document.querySelectorAll('.bp-split-input')].map(i=>({memberId:i.dataset.member,memberName:i.dataset.name,amount:CasaCore.money(i.value)})).filter(s=>s.amount>0):null;
  const memberId=splitOn?null:document.getElementById('bpMember').value,mem=state.members.find(m=>m.id===memberId);
  if(!splitOn&&!mem)throw Error('Selecciona quién pagó');
  const amount=splitOn?CasaCore.money(splits.reduce((s,p)=>s+p.amount,0)):CasaCore.money(document.getElementById('bpAmount').value);CasaCore.number(amount,'Pago',true);
  const paidAt=document.getElementById('bpDate').value;
  const original=billPayments.find(p=>p.id===h._paymentId);const next={...original,paidAt,amount,memberId,memberName:splitOn?'Varios integrantes':mem.name,splits:splits||[]};
  await BillService.edit(billId,h._paymentId,next,operationMeta('correct-bill-payment'));closeModal();toast('Pago conciliado');
 },
 async confirmDeleteBillPayment(billId,idx){
 const h=state.bills.find(b=>b.id===billId)?.history[idx];if(!h?._paymentId)throw Error('Migra primero los pagos antiguos');
 if(!confirm('¿Anular el pago y recalcular el siguiente vencimiento pendiente?'))return;
 await BillService.edit(billId,h._paymentId,{voided:true},{kind:'void-bill-payment'});closeModal();toast('Pago anulado y vencimiento recalculado');
 },
 async saveDebt(id){
  const name=document.getElementById('dbName').value.trim(),fromId=document.getElementById('dbFrom').value,toId=document.getElementById('dbTo').value;
  const totalAmount=CasaCore.money(document.getElementById('dbTotal').value),startDate=document.getElementById('dbDate').value||todayISO();
  if(!id)throw Error('Los nuevos préstamos personales se registran en Préstamos privados');
  if(!name||!fromId||!toId||fromId===toId)throw Error('Completa nombre, deudor y acreedor distintos');CasaCore.number(totalAmount,'Deuda',true);
  const data={name,fromId,toId,totalAmount,startDate,fromName:state.members.find(m=>m.id===fromId)?.name||'—',toName:state.members.find(m=>m.id===toId)?.name||'—'};
  const initial=CasaCore.money(document.getElementById('dbInitialPaid')?.value||0);
  await Data.atomic(operationMeta('save-debt'),async t=>{const old=id?await t.get('debts',id):null;if(old&&(old.fromId!==fromId||old.toId!==toId)&&(old.payments||[]).length)throw Error('No cambies deudor o acreedor de una deuda con abonos');await t.put('debts',id||t.id,{...data,...(!id?{payments:initial?[{id:t.id+'-initial',amount:initial,date:startDate,note:'Abono inicial'}]:[]}:{} )});});closeModal();toast('Deuda guardada');
 },
 async saveDebtPayment(id){
  const amount=CasaCore.money(document.getElementById('dpAmount').value);CasaCore.number(amount,'Abono',true);
  const date=document.getElementById('dpDate').value||todayISO(),note=document.getElementById('dpNote').value.trim();
  await Data.atomic(operationMeta('debt-payment'),async t=>{const d=await t.get('debts',id);if(!d||d.archived)throw Error('Deuda no disponible');await t.put('debts',id,{payments:(d.payments||[]).concat({id:t.id,amount,date,note})});});closeModal();toast('Abono registrado');
 },
 async confirmDeleteDebtPayment(id,idx){
  const before=state.debts.find(d=>d.id===id)?.payments[idx];if(!before||!confirm('¿Eliminar este abono?'))return;
  await Data.atomic({kind:'correct-debt-payment'},async t=>{const d=await t.get('debts',id);const payments=[...(d.payments||[])];if(JSON.stringify(payments[idx])!==JSON.stringify(before))throw Error('Los abonos cambiaron. Abre de nuevo el historial.');payments.splice(idx,1);await t.put('debts',id,{payments});});closeModal();toast('Abono eliminado');
 },
 async markTransferPaid(periodKey,granularity,fromId,fromName,toId,toName,amount){
  if(!confirm(`¿Confirmas la transferencia de ${fmtMoney(amount)} de ${fromName} a ${toName}?`))return;
  const expectedRevision=Number(state.settings.revision||0),operationId='settlement-'+expectedRevision+'-'+fromId+'-'+toId;
  const res=await fetch('/api/settle',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await signedInUser.getIdToken()},body:JSON.stringify({fromId,toId,amount,expectedRevision,operationId})});
  const data=await res.json();if(!res.ok)throw Error(data.error||'No se pudo registrar la transferencia');toast('Transferencia registrada');
 },
 async confirmUndoSettlement(id){if(confirm('¿Anular esta transferencia?')){await Data.atomic({kind:'void-settlement'},async t=>{await t.put('settlements',id,{voided:true});});toast('Transferencia anulada');}},
 async confirmCloseCycle(cycleKey){
  if(cycleKey>=cycleKeyFor(todayISO())){toast('Solo se pueden cerrar ciclos que ya terminaron');return;}
  if(!confirm('¿Cerrar '+cycleLabel(cycleKey)+'? El servidor conciliará el periodo y bloqueará cambios.'))return;
  const res=await fetch('/api/close-cycle',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await signedInUser.getIdToken()},body:JSON.stringify({cycleKey})});
  const data=await res.json();if(!res.ok)throw Error(data.error||'No se pudo cerrar');toast('Ciclo conciliado y cerrado');
 }
});
function loanMoney(cents){return fmtMoney(cents/100);}
function privateLoansBody(){
 const me=signedInUser?.uid;
 if(!accountMemberId)return '<div class="panel"><div class="panel-body">Tu cuenta aún no está vinculada a un integrante. El administrador debe vincularla antes de usar préstamos privados. Cambiar de cuenta requiere iniciar sesión con el acceso correspondiente.</div></div>';
 if(privateLoanMessage)return '<div class="panel"><div class="panel-body">'+esc(privateLoanMessage)+'</div></div>';
 return '<p class="page-sub">Estos préstamos no cambian el saldo compartido ni el inventario. Se consultan únicamente con tu cuenta de acceso. Visibilidad restringida entre integrantes; la administración técnica de Firebase y sus respaldos conserva acceso.</p>'+ (privateLoans.length?privateLoans.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(l=>{
  const lender=l.lenderUid===me,pending=l.payments.find(p=>p.status==='pending'),paid=l.payments.filter(p=>p.status==='confirmed').reduce((s,p)=>s+p.amountCents,0),left=l.amountCents-paid;
  const action=(key,label,paymentId='')=>`<button class="btn btn-sm" onclick="App.privateLoanAction('${l.id}','${key}','${paymentId}')">${label}</button>`;
  return `<div class="panel" style="margin-bottom:12px"><div class="panel-body"><h3>${esc(l.title)}</h3><p>${l.status==='pending'?'Solicitud por confirmar':l.status==='rejected'?'Solicitud rechazada':l.status==='cancelled'?'Solicitud cancelada':l.status==='settled'?'Préstamo liquidado':lender?esc(l.borrowerName)+' te debe':'Le debes a '+esc(l.lenderName)}: <strong>${loanMoney(['pending','rejected','cancelled'].includes(l.status)?l.amountCents:left)}</strong></p><p>${esc(l.lenderName)} → ${esc(l.borrowerName)}</p><p>Préstamo: ${loanMoney(l.amountCents)} · Devuelto y confirmado: ${loanMoney(paid)}</p><p>${({pending:'Pendiente de confirmación de la otra persona. Aún no es deuda confirmada.',active:'Préstamo confirmado',settled:'Liquidado',rejected:'Solicitud rechazada; no genera deuda',cancelled:'Solicitud cancelada; no genera deuda'})[l.status]||''}</p>
  ${l.status==='pending'?(l.createdBy===me?action('cancel','Cancelar solicitud'):action('accept','Confirmo que el préstamo ocurrió')+' '+action('reject','No reconozco este préstamo')):''}
  ${l.status==='active'&&!lender&&!pending?`<button class="btn btn-sm btn-primary" onclick="App.openPrivatePayment('${l.id}')">Reportar devolución</button>`:''}
  ${pending?`<p>Abono de ${loanMoney(pending.amountCents)} por confirmar. El pendiente todavía no se reduce.</p>${lender?action('confirm-payment','Ya recibí este abono',pending.id)+' '+action('reject-payment','No lo recibí',pending.id):''}`:''}
  <details><summary>Ver historial</summary><p>Solicitud: ${esc(l.createdAt.slice(0,10))}</p>${l.payments.map(p=>'<p>'+esc(p.reportedAt.slice(0,10))+' · '+loanMoney(p.amountCents)+' · '+({pending:'Por confirmar',confirmed:'Recibido',rejected:'No recibido'})[p.status]+'</p>').join('')}<p>${l.events.filter(e=>e.action!=='payment').map(e=>esc(e.at.slice(0,10))+' · '+esc(({create:'Solicitud registrada',accept:'Préstamo confirmado',reject:'Solicitud rechazada',cancel:'Solicitud cancelada','confirm-payment':'Abono confirmado','reject-payment':'Abono rechazado'})[e.action]||e.action)).join('<br>')}</p></details></div></div>`;
 }).join(''):'<div class="panel"><div class="panel-body">No tienes préstamos privados registrados.</div></div>');
}
async function postPrivateLoan(input){
 if(!signedInUser||!accountMemberId||!navigator.onLine||privateLoanMessage)throw Error('Verifica tu cuenta y conexión antes de registrar un préstamo');
 const res=await fetch('/api/loans',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await signedInUser.getIdToken()},body:JSON.stringify(input)});
 const data=await res.json();if(!res.ok)throw Error(data.error||'No se pudo guardar el préstamo');return data;
}
Object.assign(App,{
 openPrivateLoan(){
  if(!accountMemberId||privateLoanMessage){toast(privateLoanMessage||'Vincula tu cuenta antes de usar préstamos privados');return;}
  const me=state.members.find(m=>m.id===accountMemberId);if(!me)throw Error('Vinculación no disponible');
  openModal(`<div class="modal-header"><h3>Nuevo préstamo privado</h3><button class="btn" onclick="App.closeModal()">Cerrar</button></div><div class="modal-body"><p>Tu cuenta corresponde a ${esc(me.name)}. La otra persona deberá confirmar que recibió o entregó el dinero.</p><div class="field"><label>¿Qué ocurrió?</label><select id="loanDirection"><option value="lend">Yo presté dinero</option><option value="borrow">Me prestaron dinero</option></select></div><div class="field"><label>¿Con quién?</label><select id="loanOther"><option value="">Selecciona otra persona</option>${activeMembers().filter(m=>m.id!==me.id).map(m=>'<option value="'+m.id+'">'+esc(m.name)+'</option>').join('')}</select></div><div class="field"><label>Concepto</label><input id="loanTitle" maxlength="160"></div><div class="field"><label>Importe entregado (MXN)</label><input id="loanAmount" type="number" min="0.01" step="0.01"></div><p>Registra dinero ya entregado. No es una solicitud de financiamiento ni un gasto compartido.</p></div><div class="modal-foot"><button class="btn btn-primary" onclick="App.savePrivateLoan()">Enviar a confirmación</button></div>`);
 },
 async savePrivateLoan(){
  const operationId=state.formOperationId;
  await postPrivateLoan({action:'create',loanId:operationId,operationId,otherMemberId:document.getElementById('loanOther').value,direction:document.getElementById('loanDirection').value,title:document.getElementById('loanTitle').value,amount:document.getElementById('loanAmount').value});closeModal();toast('Préstamo registrado; falta confirmación de la otra persona');
 },
 openPrivatePayment(id){
  const loan=privateLoans.find(l=>l.id===id);if(!loan||loan.borrowerUid!==signedInUser?.uid)throw Error('Préstamo no disponible');
  openModal(`<div class="modal-header"><h3>Reportar devolución</h3><button class="btn" onclick="App.closeModal()">Cerrar</button></div><div class="modal-body"><p>Reporta únicamente dinero que ya devolviste. ${esc(loan.lenderName)} debe confirmar que lo recibió.</p><div class="field"><label>Importe devuelto (MXN)</label><input id="loanPayment" type="number" min="0.01" step="0.01"></div></div><div class="modal-foot"><button class="btn btn-primary" onclick="App.savePrivatePayment('${id}',${loan.version})">Reportar abono</button></div>`);
 },
 async savePrivatePayment(id,expectedVersion){await postPrivateLoan({action:'payment',loanId:id,operationId:state.formOperationId,expectedVersion,amount:document.getElementById('loanPayment').value});closeModal();toast('Abono reportado. El saldo bajará cuando se confirme la recepción');},
 async privateLoanAction(id,action,paymentId){
  const l=privateLoans.find(l=>l.id===id);if(!l)throw Error('Préstamo no disponible');
  if(!confirm('¿Confirmas esta acción? Quedará en el historial de las dos personas.'))return;
  await postPrivateLoan({action,loanId:id,expectedVersion:l.version,operationId:uid(),paymentId});toast('Confirmación guardada');
 },
 explainBalance(memberId){
  const row=computeBalances().balances.find(r=>r.member.id===memberId);if(!row)return;
  const adjustment=(Math.round(row.balance*100)-Math.round(row.paid*100)+Math.round(row.fairShare*100))/100;
  const lines=allExpenseRows().filter(r=>!r.debtFronted).map(r=>{const part=CasaCore.balances([r],state.members,[]).balances.find(b=>b.member.id===memberId);return {r,part};}).filter(x=>x.part&&(x.part.paid||x.part.fairShare));
  openModal(`<div class="modal-header"><h3>Cuenta de ${esc(row.member.name)}</h3><button class="btn" onclick="App.closeModal()">Cerrar</button></div><div class="modal-body"><p>Dinero que pagaste en compras y servicios: <strong>${fmtMoney(row.paid)}</strong></p><p>Tu parte de esos gastos: <strong>${fmtMoney(row.fairShare)}</strong></p><p>Ajuste por transferencias entre integrantes: <strong>${adjustment>=0?'+':''}${fmtMoney(adjustment)}</strong></p><p>Pagaste − te correspondía + ajuste = <strong>${row.balance<0?'Te toca pagar ':row.balance>0?'Tienes a favor ':'Sin pendiente '}${fmtMoney(Math.abs(row.balance))}</strong></p><p>Una transferencia que envías reduce lo que debes; una que recibes reduce lo que te debían. Los préstamos privados van por separado.</p><details><summary>Ver cada compra y servicio</summary>${lines.map(({r,part})=>'<p>'+esc(r.name)+' · '+fmtDate(r.date)+'<br>Pagaste '+fmtMoney(part.paid)+' · te corresponde '+fmtMoney(part.fairShare)+'</p>').join('')}</details></div>`);
 }
});

// Each device serializes commands and keeps the form operation ID on retry.
let commandPending=false;
for(const [name,fn] of Object.entries(App)){
 if(name==='prepareTicketPhoto'||(fn.constructor.name!=='AsyncFunction'&&!name.startsWith('confirmDelete')))continue;
 App[name]=async function(...args){
  if(commandPending)return;commandPending=true;
  try{return await fn.apply(App,args);}catch(e){console.error(name,e);toast(e.message||'No se pudo guardar. Revisa la conexión y vuelve a intentar.');}finally{commandPending=false;render();}
 };
}

boot();
})();
